<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Dune Learning · 25-minute section</title>
<style>
:root { --bg:#05070c; --ink:#f4f7fb; --muted:#9aa8bd; --line:#243044; --blue:#2f9bff; --cyan:#5ad7ff; --silver:#d5dbe3; --good:#7dcea0; --warn:#e2a15c; --hot:#ff5d7a; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); }
body { font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh;
  background: radial-gradient(900px 420px at 80% -10%, rgba(47,155,255,.22), transparent 60%), var(--bg); }
a { color:var(--cyan); }
button,select { font:inherit; }
.app { max-width:920px; margin:0 auto; padding:12px 14px 108px; }
.top { display:flex; gap:12px; align-items:center; background:linear-gradient(180deg,#121a28,#0c111a); border:1px solid var(--line); border-radius:18px; padding:10px 12px; }
.logo { width:74px; height:74px; border-radius:16px; object-fit:cover; background:#000; flex:none; }
.kicker { margin:0; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); font-size:11px; font-weight:700; }
h1 { margin:2px 0 0; font-size:22px; letter-spacing:.04em; }
.tag,.meta { margin:2px 0 0; color:var(--muted); font-size:13px; }
.reader { position:sticky; top:8px; z-index:5; margin:12px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:rgba(8,12,18,.92); border:1px solid var(--line); border-radius:16px; padding:10px; backdrop-filter:blur(10px); }
.reader b { font-size:13px; }
.reader .line { flex:1 1 180px; color:var(--muted); font-size:13px; }
.btn { border:1px solid var(--line); background:#182232; color:var(--ink); border-radius:999px; padding:8px 12px; cursor:pointer; }
.btn.on { background:linear-gradient(180deg,#1d6dff,#1490ff); border-color:#67b7ff; color:#fff; }
.btn.hot { background:#2a1820; border-color:#5a3040; color:#ffd0da; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card,.panel { background:linear-gradient(180deg,rgba(22,32,48,.95),rgba(12,18,28,.95)); border:1px solid var(--line); border-radius:18px; padding:14px; }
.card { cursor:pointer; text-align:left; color:inherit; width:100%; }
.emoji { font-size:26px; display:block; margin-bottom:6px; }
.card h3,.panel h2,.panel h3 { margin:0 0 6px; }
.card p { color:var(--muted); margin:0; font-size:13px; }
.hero { margin:12px 0; padding:16px; border-radius:20px; background:linear-gradient(135deg,#102033,#0b121c 55%,#081018); border:1px solid #2a4568; }
.pills { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; }
.pill { border:1px solid var(--line); border-radius:999px; padding:4px 8px; font-size:12px; color:var(--good); }
ol.steps { margin:8px 0 0; padding-left:18px; }
ol.steps li, ul li { margin:0 0 8px; }
.term { border-left:3px solid var(--blue); padding:8px 10px; margin:0 0 8px; background:#0c1522; border-radius:0 12px 12px 0; }
.take { background:#142033; border:1px solid #2c527c; }
.desk { background:#17140f; border:1px solid #4a3b28; }
.desk h3 { color:var(--warn); }
.miss { background:#10180f; border:1px solid #2d4a32; }
.miss h3 { color:var(--good); }
pre { overflow:auto; background:#070b12; border:1px solid var(--line); border-radius:12px; padding:12px; font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; color:#d5e6ff; }
label { display:flex; gap:8px; align-items:flex-start; margin:0 0 8px; font-size:14px; }
input,select.field { accent-color:var(--blue); }
.out { font-size:18px; font-weight:700; margin:8px 0; }
nav.dock { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; gap:8px; justify-content:center; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(5,7,12,.94); border-top:1px solid var(--line); }
nav.dock button { min-width:92px; }
[hidden] { display:none !important; }
.progress { height:8px; background:#1a2433; border-radius:99px; overflow:hidden; margin-top:10px; }
.progress span { display:block; height:100%; background:linear-gradient(90deg,#1f8cff,#5ad7ff); width:0; }
@media (max-width:640px) { .grid { grid-template-columns:1fr; } h1 { font-size:20px; } }
</style>
</head>

    html:`<section class="hero"><p class="kicker">Page 1</p><h2>🚫 The exclusion filter</h2>
      <p class="meta">Built to print no-trade and keep chop from eating fees. The clock inside the gate is still the 15-minute candle. This page is the 25-minute desk around it.</p></section>
      <section class="panel"><ol class="steps">
        <li><b>Cowen gate.</b> Risk elevated and the weekly trending down invalidates a 15-minute long. Log it. Do not execute it.</li>
        <li><b>00:00 UTC VWAP.</b> Resets at the crypto day. Price has to close back through that line.</li>
        <li><b>Sweep and reclaim.</b> A dip under the same-day low is not a buy. A later 15-minute candle must close back above that low, and the body must be green.</li>
        <li><b>Convergence.</b> 20 EMA on the trade side. RSI cleanly through 50.</li>
        <li><b>Close only.</b> A wick is a reach. The 15-minute timer has to expire with the body across the level.</li>
        <li><b>Higher window.</b> 1-hour and 4-hour must share the 15-minute bias. If they do not, the trigger is dead.</li>

    html:`<section class="hero"><p class="kicker">Page 2</p><h2>⚖️ Binary markets vs perps</h2>

      <section class="panel"><h3>Why the 15-minute up/down book is the wrong tool</h3>
        <p>Polymarket does list 15-minute and hourly Bitcoin up/down markets. A binary settles at $0 or $1. If VWAP catches a $2,000 push, the contract pays the odds you bought, not the size of the move.</p>
        <p>A candle-close scalp wants dollar-delta and a book that can fill the size. That is a perpetual, not a yes/no share.</p></section>

    html:`<section class="hero"><p class="kicker">Page 3</p><h2>🧩 Developer handoff</h2>
      <p class="meta">Exact draft from the file. It is a filter, not an order router.</p></section>
      <section class="panel"><pre>const MACRO_RISK_HIGH = checkCowenRisk();
const WEEKLY_TREND_DOWN = checkWeeklyTrend();

function evaluate15mCandle(candle, vwap, ema20, rsi, dailyLow, timeframe1H, timeframe4H) {
    if (MACRO_RISK_HIGH && WEEKLY_TREND_DOWN && candle.direction === 'LONG') {
        logTrade("OBSERVE_ONLY: Macro risk gate failed.");
        return false;
    }
    if (candle.isWickOnly()) return false;
    const sweptLiquidity = checkSweep(candle, dailyLow);
    if (sweptLiquidity && candle.close > dailyLow && candle.color === 'GREEN') {
        if (candle.close > vwap && ema20.aligned && rsi > 50) {
            if (timeframe1H.bias === 'LONG' && timeframe4H.bias === 'LONG') {
                triggerOverlayAlert("VALID LONG SETUP");
                return true;
            }
        }
    }
    return false;
}</pre>
      <p class="meta">Gap in the draft: the true branch requires a sweep. A VWAP reclaim with no sweep falls through to false. The written gate treats the sweep as its own protocol, not the only door. Do not ship this function as the whole model.</p></section>

        <label><input type="checkbox" id="rsi"> RSI crossed 50</label>
        <label><input type="checkbox" id="sweep"> Same-day low was swept, then a later 15-minute body closed back above it and closed green</label>
        <label><input type="checkbox" id="htf"> 1-hour and 4-hour agree</label>
        <label>Direction
          <select class="field" id="dir"><option>LONG</option><option>SHORT</option></select>
        </label>
        <p class="out" id="verdict">NO-TRADE</p>
        <p class="meta" id="why">Check a closed candle. Nothing is sent.</p>
      </section>`
  }
];
function afterRender(){
  const board = document.getElementById("board");
  if(!board) return;
  const verdict = document.getElementById("verdict");
  const why = document.getElementById("why");
  const read = () => {
    const risk = document.getElementById("risk").checked;
    const wick = document.getElementById("wick").checked;
    const vwap = document.getElementById("vwap").checked;
    const ema = document.getElementById("ema").checked;
    const rsi = document.getElementById("rsi").checked;
    const sweep = document.getElementById("sweep").checked;
    const htf = document.getElementById("htf").checked;
    const dir = document.getElementById("dir").value;
    if(dir === "LONG" && risk){ verdict.textContent = "OBSERVE ONLY"; why.textContent = "Macro gate failed. Log the long. Do not execute it."; return; }
    if(wick){ verdict.textContent = "NO-TRADE"; why.textContent = "Wick is not a fill."; return; }
    if(!(vwap && ema && rsi && htf)){ verdict.textContent = "NO-TRADE"; why.textContent = "VWAP close, EMA, RSI, and both higher windows are required."; return; }
    if(!sweep){ verdict.textContent = "NOTE ONLY"; why.textContent = "Written gate can see a VWAP reclaim. The handoff function still returns false without the sweep. Do not call it valid until you decide which rule is live."; return; }
    verdict.textContent = "READY TO SIGN";
    why.textContent = "Row can go on the overlay after you sign it. This page still does not send an order.";
  };
  board.querySelectorAll("input,select").forEach(el => el.addEventListener("change", read));
  read();
}

const view = document.getElementById("view");
const readLine = document.getElementById("readLine");
const listenBtn = document.getElementById("listenBtn");
const pauseBtn = document.getElementById("pauseBtn");
const offBtn = document.getElementById("offBtn");
const rateEl = document.getElementById("rate");
let index = 0, chunks = [], cursor = 0, playing = false, paused = false;
const done = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]"));
function saveDone(){ localStorage.setItem(DONE_KEY, JSON.stringify([...done])); }
function current(){ return pages[index]; }
function render(){
  const p = current();
  view.innerHTML = p.html;
  if(p.id === "center" && document.getElementById("cards")){
    const cards = document.getElementById("cards");
    pages.slice(1).forEach((lesson, i) => {
      const b = document.createElement("button");
      b.className = "card";
      b.innerHTML = `<span class="emoji">${lesson.emoji}</span><h3>${lesson.title}</h3><p>${done.has(lesson.id) ? "✅ Opened" : "Tap to open the full page"}</p>`;
      b.onclick = () => go(i+1);
      cards.appendChild(b);
    });
    const opened = pages.slice(1).filter(x => done.has(x.id)).length;
    const bar = document.getElementById("bar");
    if(bar) bar.style.width = (opened / (pages.length-1) * 100) + "%";
    const label = document.getElementById("barLabel");
    if(label) label.textContent = opened + " of " + (pages.length-1) + " sections opened on this phone.";
  } else done.add(p.id), saveDone();
  if(typeof afterRender === "function") afterRender();
  document.getElementById("prevBtn").disabled = index === 0;
  document.getElementById("nextBtn").textContent = index === pages.length - 1 ? "End" : "Next →";
  if(playing) startAt(0);
  else readLine.textContent = "Off. Tap listen when you want this page read out loud.";
  window.scrollTo(0,0);
}
function go(i){ index = Math.max(0, Math.min(pages.length-1, i)); history.replaceState(null, "", "#" + current().id); render(); }
function split(text){ return text.replace(/\s+/g," ").split(/(?<=[.!?])\s+/).filter(Boolean); }
function startAt(i){
  if(!window.speechSynthesis){ readLine.textContent = "This browser has no speech reader. iPhone Safari does."; return; }
  chunks = split(current().speak); cursor = i; playing = true; paused = false;
  listenBtn.classList.add("on"); listenBtn.textContent = "🔊 On"; localStorage.setItem("dl-read","on"); pump();
}
function pump(){
  if(!playing || paused) return;
  if(cursor >= chunks.length){ playing = false; listenBtn.classList.remove("on"); listenBtn.textContent = "▶️ Listen"; readLine.textContent = "Finished this page."; return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(chunks[cursor]);
  u.rate = Number(rateEl.value); u.lang = "en-US"; readLine.textContent = chunks[cursor];
  u.onend = () => { cursor += 1; if(playing && !paused) pump(); };
  u.onerror = () => { readLine.textContent = "Reader stopped. Tap listen again."; };
  window.speechSynthesis.speak(u);
}
listenBtn.onclick = () => startAt(0);
pauseBtn.onclick = () => {
  if(!playing) return;
  if(!paused){ paused = true; window.speechSynthesis.cancel(); pauseBtn.textContent = "▶️ Resume"; readLine.textContent = "Paused. " + (chunks[cursor] || ""); }
  else { paused = false; pauseBtn.textContent = "⏸️ Pause"; pump(); }
};
offBtn.onclick = () => {
  playing = false; paused = false; if(window.speechSynthesis) window.speechSynthesis.cancel();
  listenBtn.classList.remove("on"); listenBtn.textContent = "▶️ Listen"; pauseBtn.textContent = "⏸️ Pause";
  readLine.textContent = "Off. Tap listen when you want this page read out loud."; localStorage.setItem("dl-read","off");
};
rateEl.onchange = () => { if(playing && !paused) pump(); };
document.getElementById("prevBtn").onclick = () => go(index-1);
document.getElementById("nextBtn").onclick = () => go(index+1);
document.getElementById("homeBtn").onclick = () => go(0);
const hash = location.hash.replace("#","");
const found = pages.findIndex(p => p.id === hash);
go(found >= 0 ? found : 0);

</script>
</body>
</html>
