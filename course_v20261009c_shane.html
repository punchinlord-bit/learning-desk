<head>

<title>Dune Learning · Course v20261009c</title>
<style>
:root {
  --bg:#05070c; --panel:#0d121c; --panel2:#121a28; --ink:#f4f7fb; --muted:#9aa8bd;
  --line:#243044; --blue:#2f9bff; --cyan:#5ad7ff; --silver:#d5dbe3; --good:#7dcea0;
  --warn:#e2a15c; --hot:#ff5d7a;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); }
body {
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  background:
    radial-gradient(900px 420px at 80% -10%, rgba(47,155,255,.22), transparent 60%),
    radial-gradient(700px 380px at -10% 20%, rgba(90,215,255,.08), transparent 55%),
    var(--bg);
}
a { color:var(--cyan); }
button,select { font:inherit; }
.app { max-width:920px; margin:0 auto; padding:12px 14px 108px; }
.top {
  display:flex; gap:12px; align-items:center;
  background:linear-gradient(180deg,#121a28,#0c111a);
  border:1px solid var(--line); border-radius:18px; padding:10px 12px;
  box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
}
.logo { width:74px; height:74px; border-radius:16px; object-fit:cover; background:#000; flex:none; }
.brand { min-width:0; }
.kicker { margin:0; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); font-size:11px; font-weight:700; }
h1 { margin:2px 0 0; font-size:22px; letter-spacing:.04em; }
.tag { margin:2px 0 0; color:var(--muted); font-size:13px; }
.reader {
  position:sticky; top:8px; z-index:5; margin:12px 0;
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  background:rgba(8,12,18,.92); border:1px solid var(--line); border-radius:16px;
  padding:10px; backdrop-filter:blur(10px);
}
.reader b { font-size:13px; letter-spacing:.04em; }
.reader .line { flex:1 1 180px; color:var(--muted); font-size:13px; min-height:1.2em; }
.btn {
  border:1px solid var(--line); background:#182232; color:var(--ink);
  border-radius:999px; padding:8px 12px; cursor:pointer;
}
.btn.on { background:linear-gradient(180deg,#1d6dff,#1490ff); border-color:#67b7ff; color:#fff; }
.btn.hot { background:#2a1820; border-color:#5a3040; color:#ffd0da; }
.btn:active { transform:translateY(1px); }
select.btn { padding:7px 10px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card, .panel {
  background:linear-gradient(180deg,rgba(22,32,48,.95),rgba(12,18,28,.95));
  border:1px solid var(--line); border-radius:18px; padding:14px;
}
.card { cursor:pointer; text-align:left; color:inherit; width:100%; }
.card:hover, .card:focus { border-color:#3d6ea8; box-shadow:0 0 0 1px rgba(47,155,255,.35), 0 10px 30px rgba(20,80,160,.2); }
.emoji { font-size:26px; display:block; margin-bottom:6px; }
.card h3, .panel h2, .panel h3 { margin:0 0 6px; }
.card p, .meta { color:var(--muted); margin:0; font-size:13px; }
.hero {
  margin:12px 0; padding:16px; border-radius:20px;
  background:linear-gradient(135deg,#102033,#0b121c 55%,#081018);
  border:1px solid #2a4568; position:relative; overflow:hidden;
}
.hero:after {
  content:""; position:absolute; left:-10%; right:-10%; bottom:-18px; height:46px;
  background:linear-gradient(90deg,transparent,#1f8cff, #5ad7ff, transparent);
  opacity:.35; filter:blur(6px); border-radius:50%;
}
.pills { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; }
.pill { border:1px solid var(--line); border-radius:999px; padding:4px 8px; font-size:12px; color:var(--good); }
ol.steps { margin:8px 0 0; padding-left:18px; }
ol.steps li, ul li { margin:0 0 8px; }
.term { border-left:3px solid var(--blue); padding:8px 10px; margin:0 0 8px; background:#0c1522; border-radius:0 12px 12px 0; }
.term b { color:var(--silver); }
.take { background:#142033; border:1px solid #2c527c; }
.desk { background:#17140f; border:1px solid #4a3b28; }
.desk h3 { color:var(--warn); }
nav.dock {
  position:fixed; left:0; right:0; bottom:0; z-index:6;
  display:flex; gap:8px; justify-content:center;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(5,7,12,.94); border-top:1px solid var(--line); backdrop-filter:blur(12px);
}
nav.dock button { min-width:92px; }
[hidden] { display:none !important; }
.progress { height:8px; background:#1a2433; border-radius:99px; overflow:hidden; margin-top:10px; }
.progress span { display:block; height:100%; background:linear-gradient(90deg,#1f8cff,#5ad7ff); width:0; }
@media (max-width:640px) { .grid { grid-template-columns:1fr; } h1 { font-size:20px; } }
</style>

    speak:"Lesson 1. AI in the terminal. A 34 minute demonstration by NetworkChuck on moving AI out of web browser wrappers and into the command line. Gemini writes a file. Claude Code reads that file. Three tools share one folder and do not get root. A critic agent flags errors before execution. OpenCode runs the accepted code and reads the terminal output. The take: web UIs are for brainstorming. Terminal AIs are for building. On Shane's desk, the officer note becomes a file. The local model points only at that folder. It cannot invent a badge or a score. A missing fact stays missing.",
    html:`
      <section class="hero"><p class="kicker">Lesson 1 of 5</p><h2>⌨️ AI in the terminal</h2>
        <p class="meta">NetworkChuck · 34 minutes · original video and written guide</p>
        <p><a href="https://www.youtube.com/watch?v=MsQACpcuTkU">Open the video</a> · <a href="https://github.com/theNetworkChuck/ai-in-the-terminal">Written guide</a></p>
      </section>
      <section class="panel"><h3>👀 What this is</h3><p>A demonstration of moving AI out of web browser wrappers and directly into the command line. The model can read, write, and execute files inside one directory without copy-paste.</p></section>
      <section class="panel" style="margin-top:10px"><h3>🪜 What he did, in order</h3>
        <ol class="steps">
          <li><b>Gemini writes a file.</b> Chuck generates the script logic and saves it as a file, not a chat bubble.</li>
          <li><b>Claude Code integration.</b> Claude Code opens in the terminal, reads that file, and assesses the structure.</li>
          <li><b>Three tools, one folder.</b> Gemini, Claude, and the third tool point at one isolated directory. No root access.</li>
          <li><b>Critic agent.</b> A second model only looks for flaws, security risks, and logic errors before anything runs.</li>
          <li><b>OpenCode.</b> Accepted code is executed and the terminal output is read back so errors can be fixed in place.</li>
        </ol>
      </section>
      <section class="panel" style="margin-top:10px"><h3>📖 Terms</h3>
        <div class="term"><b>Claude Code.</b> Anthropic's CLI. It reads a local directory and writes files from the command line.</div>
        <div class="term"><b>Critic agent.</b> An LLM prompted only to find flaws, security risks, or logic errors in another model's code.</div>
        <div class="term"><b>OpenCode.</b> An open-source runner that lets the model execute locally and read the terminal so it can fix its own errors.</div>
      </section>
      <section class="panel take" style="margin-top:10px"><h3>💡 The take</h3><p>Web UIs are for brainstorming. Terminal AIs are for building. Constrain the model to one folder and put a critic in front of execution. You automate drafting and debugging without handing over the rest of the disk.</p></section>

    html:`
      <section class="hero"><p class="kicker">Lesson 2 of 5</p><h2>🔒 Hosting AI locally for privacy</h2>
        <p class="meta">Run the weights on metal you own</p>
        <p><a href="https://www.youtube.com/watch?v=Wjrdr0NU4Sk">Open the video</a></p>
      </section>
      <section class="panel"><h3>👀 What this is</h3><p>A guide to running large language models on your own hardware with Ollama, so a sensitive note never leaves the machine.</p></section>
      <section class="panel" style="margin-top:10px"><h3>🪜 What he did, in order</h3>
        <ol class="steps">
          <li><b>Ollama install.</b> The framework that holds and serves local weights.</li>
          <li><b>Model pull.</b> Terminal pull of a specific tag, Qwen or Llama, down to the box.</li>
          <li><b>Window.</b> A local WebUI so the chat looks normal without using the command line for every question.</li>
          <li><b>Network isolation.</b> The setup stops before any public domain. No telemetry door.</li>
        </ol>
      </section>
      <section class="panel" style="margin-top:10px"><h3>📖 Terms</h3>
        <div class="term"><b>Ollama.</b> Lightweight framework for running, managing, and talking to local models.</div>
        <div class="term"><b>Public domain, in this lesson.</b> Any server or API on the open internet, including a vendor chat endpoint. Not the copyright meaning.</div>
        <div class="term"><b>Local window.</b> A localhost UI that looks like a chat site but only talks to the GPU in the room.</div>
      </section>

const view = document.getElementById("view");
const readLine = document.getElementById("readLine");
const listenBtn = document.getElementById("listenBtn");
const pauseBtn = document.getElementById("pauseBtn");
const offBtn = document.getElementById("offBtn");
const rateEl = document.getElementById("rate");
let index = 0;
let chunks = [];
let cursor = 0;
let playing = false;
let paused = false;
const done = new Set(JSON.parse(localStorage.getItem("dl-done") || "[]"));

function saveDone(){ localStorage.setItem("dl-done", JSON.stringify([...done])); }
function current(){ return pages[index]; }

function render(){
  const p = current();
  view.innerHTML = p.html;
  if(p.id === "center"){
    const cards = document.getElementById("cards");
    pages.slice(1).forEach((lesson, i) => {
      const b = document.createElement("button");
      b.className = "card";
      b.innerHTML = `<span class="emoji">${lesson.emoji}</span><h3>${lesson.title}</h3><p>${done.has(lesson.id) ? "✅ Opened" : "Tap to open the full page"}</p>`;
      b.onclick = () => go(i+1);
      cards.appendChild(b);
    });
    const opened = pages.slice(1).filter(x => done.has(x.id)).length;
    const bar = document.getElementById("bar");
    if(bar) bar.style.width = (opened / 5 * 100) + "%";
    const label = document.getElementById("barLabel");
    if(label) label.textContent = opened + " of 5 lessons opened on this phone.";
  } else {
    done.add(p.id); saveDone();
  }
  document.getElementById("prevBtn").disabled = index === 0;
  document.getElementById("nextBtn").textContent = index === pages.length - 1 ? "End" : "Next →";
  if(playing) startAt(0);
  else readLine.textContent = "Off. Tap listen when you want this page read out loud.";
  window.scrollTo(0,0);
}
function go(i){
  index = Math.max(0, Math.min(pages.length-1, i));
  history.replaceState(null, "", "#" + current().id);
  render();
}
function split(text){
  return text.replace(/\s+/g," ").split(/(?<=[.!?])\s+/).filter(Boolean);
}
function startAt(i){
  if(!window.speechSynthesis){
    readLine.textContent = "This browser has no speech reader. iPhone Safari does.";
    return;
  }
  chunks = split(current().speak);
  cursor = i;
  playing = true;
  paused = false;
  listenBtn.classList.add("on");
  listenBtn.textContent = "🔊 On";
  localStorage.setItem("dl-read","on");
  pump();
}
function pump(){
  if(!playing || paused) return;
  if(cursor >= chunks.length){
    playing = false;
    listenBtn.classList.remove("on");
    listenBtn.textContent = "▶️ Listen";
    readLine.textContent = "Finished this page.";
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(chunks[cursor]);
  u.rate = Number(rateEl.value);
  u.lang = "en-US";
  readLine.textContent = chunks[cursor];
  u.onend = () => { cursor += 1; if(playing && !paused) pump(); };
  u.onerror = () => { readLine.textContent = "Reader stopped. Tap listen again."; };
  window.speechSynthesis.speak(u);
}
listenBtn.onclick = () => startAt(0);
pauseBtn.onclick = () => {
  if(!playing) return;
  if(!paused){
    paused = true;
    window.speechSynthesis.cancel();
    pauseBtn.textContent = "▶️ Resume";
    readLine.textContent = "Paused. " + (chunks[cursor] || "");
  } else {
    paused = false;
    pauseBtn.textContent = "⏸️ Pause";
    pump();
  }
};
offBtn.onclick = () => {
  playing = false; paused = false;
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  listenBtn.classList.remove("on");
  listenBtn.textContent = "▶️ Listen";
  pauseBtn.textContent = "⏸️ Pause";
  readLine.textContent = "Off. Tap listen when you want this page read out loud.";
  localStorage.setItem("dl-read","off");
};
rateEl.onchange = () => { if(playing && !paused) pump(); };
document.getElementById("prevBtn").onclick = () => go(index-1);
document.getElementById("nextBtn").onclick = () => go(index+1);
document.getElementById("homeBtn").onclick = () => go(0);
const hash = location.hash.replace("#","");
const found = pages.findIndex(p => p.id === hash);
go(found >= 0 ? found : 0);
</script>
