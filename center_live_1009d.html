<style>
:root { --bg:#05070c; --ink:#f4f7fb; --muted:#9aa8bd; --line:#243044; --cyan:#5ad7ff; --good:#7dcea0; --warn:#e2a15c; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(900px 420px at 80% -10%, rgba(47,155,255,.22), transparent 60%), var(--bg); }
a { color:var(--cyan); }
.app { max-width:920px; margin:0 auto; padding:12px 14px 118px; }
.top { display:flex; gap:12px; align-items:center; background:linear-gradient(180deg,#121a28,#0c111a); border:1px solid var(--line); border-radius:18px; padding:10px 12px; }
.logo { width:74px; height:74px; border-radius:16px; object-fit:cover; background:#000; }
.kicker { margin:0; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); font-size:11px; font-weight:700; }
h1 { margin:2px 0 0; font-size:22px; }
.tag,.meta { color:var(--muted); font-size:13px; margin:2px 0 0; }
.reader { position:sticky; top:8px; z-index:5; margin:12px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:rgba(8,12,18,.94); border:1px solid #2a4568; border-radius:16px; padding:10px; }
.reader b { font-size:13px; }
.line { flex:1 1 180px; color:var(--muted); font-size:13px; }
.btn { border:1px solid var(--line); background:#182232; color:var(--ink); border-radius:999px; padding:8px 12px; }
.btn.on { background:linear-gradient(180deg,#1d6dff,#1490ff); border-color:#67b7ff; color:#fff; }
.btn.hot { background:#2a1820; border-color:#5a3040; color:#ffd0da; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card,.panel { background:linear-gradient(180deg,rgba(22,32,48,.95),rgba(12,18,28,.95)); border:1px solid var(--line); border-radius:18px; padding:14px; }
.card { width:100%; text-align:left; color:inherit; }
.hero { margin:12px 0; padding:16px; border-radius:20px; background:linear-gradient(135deg,#102033,#0b121c); border:1px solid #2a4568; }
.pill { border:1px solid var(--line); border-radius:999px; padding:4px 8px; font-size:12px; color:var(--good); display:inline-block; margin:4px 6px 0 0; }
ol { margin:8px 0 0; padding-left:18px; } li { margin:0 0 8px; }
.desk { background:#17140f; border:1px solid #4a3b28; } .desk h3 { color:var(--warn); }
nav.dock { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(5,7,12,.94); border-top:1px solid var(--line); }
[hidden] { display:none !important; }
@media (max-width:640px) { .grid { grid-template-columns:1fr; } }
</style>

<script>
const BUILD = "1009d";
const pages = [
  {id:"center", title:"Learning center", emoji:"🎓", audio:"audio/01-center.mp3", html:`<section class="hero"><h2>🎓 Live learning center</h2><p>Build 1009d. If you still see the tan Georgia page, you are on the old file. This page is black, has the emblem, and the voice is a Rex file, not the phone voice.</p><span class="pill">Rex uploaded</span><span class="pill">Pause holds the spot</span><span class="pill">Off rewinds</span></section><div class="grid" id="cards"></div>`},
  {id:"terminal", title:"Terminal", emoji:"⌨️", audio:"audio/02-terminal.mp3", html:`<section class="hero"><p class="kicker">Lesson 1</p><h2>⌨️ AI in the terminal</h2><p><a href="https://www.youtube.com/watch?v=MsQACpcuTkU">Video</a> · <a href="https://github.com/theNetworkChuck/ai-in-the-terminal">Guide</a></p></section><section class="panel"><ol><li>Web chat is brainstorming. The build is a file.</li><li>Claude Code reads that file. Three tools, one folder, no root.</li><li>Critic scans before OpenCode runs.</li><li>Officer note in. Draft file out. Missing fact stays missing. You sign it.</li></ol></section>`},
  {id:"local", title:"Local model", emoji:"🔒", audio:"audio/03-local.mp3", html:`<section class="hero"><p class="kicker">Lesson 2</p><h2>🔒 Local privacy</h2><p><a href="https://www.youtube.com/watch?v=Wjrdr0NU4Sk">Video</a></p></section><section class="panel"><ol><li>Ollama on the ROG box. No public domain.</li><li>Two 8 GB 2080s are not a 16 GB pool. Split layers, or run a Q4 on one card.</li><li>You sign the draft. Nothing posts.</li></ol></section>`},
  {id:"kevin", title:"Eight jobs", emoji:"🧩", audio:"audio/04-kevin.mp3", html:`<section class="hero"><p class="kicker">Lesson 3</p><h2>🧩 Kevin's 8 jobs</h2><p><a href="https://www.youtube.com/watch?v=xB4Vwwj0KQo">Tour</a> · <a href="https://www.youtube.com/watch?v=puPAEyNfdhs">Eight jobs</a></p></section><section class="panel"><ol><li>Revenue, content, video, offer, routing, follow-up, reliability, memory.</li><li>Q6 for tools. Q4 gets fuzzy.</li><li>No ninth job. No auto-email, auto-approve, or auto-post.</li></ol></section>`},
  {id:"security", title:"Defense", emoji:"🛡️", audio:"audio/05-security.mp3", html:`<section class="hero"><p class="kicker">Lesson 4</p><h2>🛡️ Stage file and wrappers</h2></section><section class="panel"><ol><li>Shannon stage file. Missing fact fails safe.</li><li>Long secrets, lockout, failure log, no keys in git.</li><li>Stadium draws the signed file to OBS. Camofox stays out.</li></ol></section>`},
  {id:"btc", title:"15-minute gate", emoji:"₿", audio:"audio/06-btc.mp3", html:`<section class="hero"><p class="kicker">Lesson 5</p><h2>₿ 15-minute gate</h2></section><section class="panel desk"><ol><li>Cowen high and weekly down: long stays a note.</li><li>VWAP reset 00:00 UTC. Body close, not a wick.</li><li>20 EMA same side. RSI through 50. 1H and 4H agree.</li><li>30 closed rows before a rule change.</li></ol></section>`},
  {id:"min25", title:"25-minute section", emoji:"⏱️", audio:"audio/07-min25.mp3", html:`<section class="hero"><p class="kicker">Fresh page</p><h2>⏱️ 25-minute section</h2><p><a href="min25.html">Full board</a></p></section><section class="panel"><ol><li>Exclusion filter. Most windows are no-trade.</li><li>Binaries pay the odds, not the $2,000 move. Perps pay the move.</li><li>Polymarket perps launched Sept 3, 2026, BTC slider to 20x. Hyperliquid depth was not remeasured.</li><li>Handoff function only returns true after a sweep. Board does not send an order.</li></ol></section>`}
];
const view = document.getElementById("view");
const audio = document.getElementById("grok");
const line = document.getElementById("readLine");
const playBtn = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");
let index = 0;
function current(){ return pages[index]; }
function loadTrack(){
  const p = current();
  audio.pause();
  audio.src = p.audio + "?v=" + BUILD;
  audio.load();
  line.textContent = "Rex track ready · " + p.title;
  playBtn.classList.remove("on");
  playBtn.textContent = "▶️ Play";
}
audio.addEventListener("loadedmetadata", () => {
  const s = Math.round(audio.duration);
  line.textContent = "Rex · " + current().title + " · " + s + "s uploaded";
});
audio.addEventListener("error", () => {
  line.textContent = "Track failed to load. Check the connection and tap play again.";
});
audio.addEventListener("play", () => { playBtn.classList.add("on"); playBtn.textContent = "🔊 Playing"; });
audio.addEventListener("pause", () => { if(audio.currentTime > 0 && !audio.ended) { playBtn.classList.remove("on"); playBtn.textContent = "▶️ Play"; } });
audio.addEventListener("ended", () => { playBtn.classList.remove("on"); playBtn.textContent = "▶️ Play"; line.textContent = "Finished this page."; });
playBtn.onclick = () => { audio.play().catch(() => { line.textContent = "Phone blocked play. Tap play once more."; }); };
pauseBtn.onclick = () => { audio.pause(); line.textContent = "Paused at " + Math.round(audio.currentTime) + "s. Tap play to resume."; };
document.getElementById("offBtn").onclick = () => { audio.pause(); audio.currentTime = 0; playBtn.classList.remove("on"); playBtn.textContent = "▶️ Play"; line.textContent = "Off. Rewound."; };
function render(){
  const p = current();
  view.innerHTML = p.html;
  if(p.id === "center"){
    const cards = document.getElementById("cards");
    pages.slice(1).forEach((lesson, i) => {
      const b = document.createElement("button");
      b.className = "card";
      b.innerHTML = `<h3>${lesson.emoji} ${lesson.title}</h3><p class="meta">Rex track on this page</p>`;
      b.onclick = () => go(i+1);
      cards.appendChild(b);
    });
  }
  document.getElementById("prevBtn").disabled = index === 0;
  loadTrack();
  history.replaceState(null, "", "#" + p.id);
  window.scrollTo(0,0);
}
function go(i){ index = Math.max(0, Math.min(pages.length-1, i)); render(); }
document.getElementById("prevBtn").onclick = () => go(index-1);
document.getElementById("nextBtn").onclick = () => go(index+1);
document.getElementById("homeBtn").onclick = () => go(0);
const found = pages.findIndex(p => p.id === location.hash.replace("#",""));
go(found >= 0 ? found : 0);
</script>
