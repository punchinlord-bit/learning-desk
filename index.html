<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune Learning</title>
<style>
:root{--bg:#12100e;--panel:#1c1814;--ink:#f6f1e8;--muted:#cbbba8;--line:#3c342c;--accent:#e2a15c;--green:#8eae86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
.top{padding:14px 14px 8px;background:#16130f;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.mark{font:600 11px/1 -apple-system,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font:600 1.25rem/1.2 -apple-system,sans-serif;margin:0 0 8px}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
.tabs button{background:#241f1a;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font:13px/1 -apple-system,sans-serif;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#1a120c;border-color:var(--accent)}
main{max-width:880px;margin:0 auto;padding:12px}
article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.n{color:var(--green);font:12px/1 -apple-system,sans-serif}
h2{font:600 1.02rem/1.3 -apple-system,sans-serif;margin:4px 0 6px}
p{margin:0;color:var(--muted)}
</style></head><body>
<div class="top"><p class="mark">Dune Learning</p><h1>One lesson per video</h1><div class="tabs" id="tabs"></div></div>
<main id="main"></main>
<script>
const sources = {"NetworkChuck": [["You've been using AI the hard way", "2.2 million views, 34 minutes. The browser hides the context window. The terminal can see a folder. Start here. Make one folder, let Gemini write a file, then stop."], ["Host all your AI locally", "About 2.7 million views. Ollama holds the model. Open WebUI is the window. Stop before a public domain. Incident notes stay on the machine."], ["Run your own AI, private", "About 2.6 million views. Same lesson, shorter. A model is a file. Load it. Do not add the two 8 GB cards in your head."], ["Claude Code on your phone", "About 278,000 views. A remote for an agent already running. Useless until the folder and the skill exist."]], "Cole Medin": [["90 percent of agents in 30 minutes", "30,200 views. Four parts: model, prompt, one tool, a trace. Your tool is read this file, write that file."], ["Best way to build agents", "173,000 views. The warning cut. People fail by adding pieces. Keep the agent small."], ["Complete agent blueprint", "77,000 views. His map from empty folder to a working agent. Use it as a map, not a second product."], ["Pydantic plus DeepSeek", "80,000 views. A typed output. Useful later so the draft cannot skip a heading. Not the first run."], ["28 minutes that change the build", "54,000 views. Another pass on the same four parts. Watch after the 30-minute one if the first did not stick."], ["Three labs' agent guides in 18 minutes", "39,000 views. Official guides, compressed. Plan, tool permission, human check."], ["Top 20 lessons from hundreds of agents", "17,000 views. A list of scars. Take the ones that match the note-and-draft loop. Leave the rest."]], "Tech With Tim": [["Claude Code for beginners", "About 1.7 million views, 36 minutes. Install. Open one folder. Context file is the standing order."], ["Ollama in 15 minutes", "About 1.2 million views. Pull a small model. One prompt. Write down the tag. Then the fake note."]], "Anthropic": [["Claude Code best practices", "About 576,000 views, 26 minutes. Plan, short context file, one folder, you review the diff. They do not pick your local model."]], "Flux": [["500 posts a day", "About 2,200 views, 14 minutes. Transcript read. Inbox, posting, published, failed. 500 is a claim. Watch the first file."], ["One-person stack", "About 8,600 views, 19 minutes. Transcript read. Qwen sorts, DeepSeek middle, Opus decides. Token-cut number was not shown."], ["$50k website", "About 8,000 views, 21 minutes. Spec before pages. The price is the title. Assets sit on a Drive file."], ["Coca-Cola edit", "7 minutes, 77 views. A commercial made cheap. Editing craft. Not the report loop."], ["Liquid glass preset", "12 minutes, about 4,300 views. DaVinci look. Later, for a title card. Not a model."], ["3D client edit", "9 minutes. DaVinci. Listed only. Not an agent lesson."], ["Eye animation", "11 minutes. Retention edit in Resolve. Listed only."], ["Soft color grade", "7 minutes. Color. Listed only."], ["Split transition", "10 minutes. Fusion transition. Listed only."], ["Apple-style 3D", "18 minutes. Motion in Resolve. Listed only."], ["Left After Effects", "21 minutes. Resolve versus After Effects. Listed only."]], "Kevin Unk": [["Five projects, one system", "81 minutes. Transcript read. Rented card, SSH, Claude Code still paid, Ollama, Hermes, a dashboard that reads files."], ["Eight jobs", "46 minutes. Transcript read. Eight files. Do not add a ninth. Your eight is one draft."], ["Omarchy", "8 minutes, 715 views. A Linux desktop for agents. Skip until the note loop works."], ["Jarvis phone app", "11 minutes, 37 views. A remote for Hermes already running. Same rule as Chuck's phone video."], ["GoHighLevel sales cut", "7 minutes. Agents on 74 videos, in the title. Money claims are titles. The pipeline shape is the lesson."], ["Editing and posting engine", "23 minutes. Claude Code cuts and posts. Copy the folder. Do not copy a volume claim."], ["Business operating system", "12 minutes. Short map of the same stack as the 81-minute tour."], ["Mission control", "26 minutes. Dashboard over business data. Listing does not prove the data was live."], ["100 videos at once", "20 minutes. Remotion and Hyperframes. 100 is the title. A clip only after an approved draft."], ["Hermes for six hours", "31 minutes. Overnight run, in the title. No log on the page. A night agent still needs a job file."], ["One-prompt Jarvis short", "3 minutes. Comment bait. A spec file and a rented card. Not a build guide."], ["24-7 short", "75 seconds, about 1,100 views. Claude on a GPU pod, Hermes beside it. A trailer, not a lesson."]], "Mark Gadala": [["Uncensored agents on any computer", "Public description. Ollama, Hermes, a 27B for 24 GB, a 2B for 4 GB. Your card is 8 GB. Transcript was not fetched."]], "AICodeKing": [["SuperGemma with Hermes", "A 26B uncensored file paired with a harness. He says about 24 GB. Not your 2080. Read the card before a pull."]], "Saved reels": [["Shannon", "Caption named Shannon and Claude Code. The public project is Keygraph's tester: github.com/KeygraphHQ/shannon. A Claude Code wrapper is github.com/us/shannon-on-claude-code. Method: each phase writes a markdown deliverable, the next phase reads it. Copy that file handoff. Attack steps stay out. Only an app you own, or a client who asked in writing."], ["Uncensored reel", "No product name on the page. Method he is selling is a comment word for a DM link. Do not build on that. Your method is two local files in Ollama: base Qwen for the client draft, a looser quant for internal wording only."], ["Six repos", "techskills named the six. Keep Hyperframes only: github.com/heygen-com/hyperframes, HTML to a short video, after an approved draft. Claude Ads, Fincept, and Vibe-Trading are other businesses. Camofox, github.com/jo-inc/camofox-browser, is a stealth browser. Leave it."], ["Stadium page", "Method is a single index.html, Three.js for the 3D, GSAP for the camera, seats are generated not imported. Repo: github.com/thebuggeddev/football-stadium. Prices on screen are fake. Your use is flatter: a page with name, score, and note, filled from a file you approve, shown in OBS."], ["Claude mods", "nocode.joshua. Method he claims: describe the mod, Claude builds it. Three uses: sessions pass work, a dashboard inside the tool, easy jobs routed to a cheaper model. No repo on the reel. Your copy is the route only. Qwen writes the missing-list file. You write the draft."], ["Do not fill a blank", "Champ McCorkle. Method: stop trusting a model that sees a title and invents the page. He names Firecrawl, then says he moved to Context.dev. Your rule is stricter. No source line under the claim, the draft says missing."], ["Mimic", "alex.nex.tech pointed at littledivy/mimic, github.com/littledivy/mimic, about 2,500 stars. Method: it watches network calls from a session you already have and generates a Python client. That is a description, not a build step. Do not use it on an app you do not own."], ["Secrets", "deonnahodges. Method: keys were committed, so they leaked. Fix is an env file listed in .gitignore. Do not search GitHub for other people's keys. Your tokens never enter this repo."], ["Ruflo", "Kayvon's comment word was FLOW. The project that matches the 60-agent claim is ruvnet/ruflo, also called Claude Flow, github.com/ruvnet/ruflo. Method: an orchestrator assigns jobs and can route cheap work to a cheaper model. You do not install the swarm. One job file is the start."], ["26-minute app", "futurewalt.ai. No repo on the post. Method claimed: one person, Claude, a goal, a live build. The usable part is a written spec before any file is created."]]};
const names = Object.keys(sources);
const tabs = document.getElementById("tabs");
const main = document.getElementById("main");
function show(name){
  tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.n===name));
  const items = sources[name];
  main.innerHTML = items.map((it,i)=>'<article><p class="n">'+name+' · lesson '+(i+1)+' of '+items.length+'</p><h2>'+it[0]+'</h2><p>'+it[1]+'</p></article>').join("");
}
names.forEach(n=>{const b=document.createElement("button"); b.textContent=n+" ("+sources[n].length+")"; b.dataset.n=n; b.onclick=()=>show(n); tabs.appendChild(b);});
show(names[0]);
</script></body></html>
