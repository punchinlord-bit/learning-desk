<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune Learning</title>
<style>
:root { --bg:#f4f0e8; --ink:#1b1612; --muted:#5c534b; --line:#e0d6c8; --card:#fffdf9; --accent:#8d4e22; }
body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.6 Georgia, serif; }
header { background:var(--card); border-bottom:1px solid var(--line); padding:16px; position:sticky; top:0; }
.mark { font:600 12px/1 -apple-system,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }
h1 { font:600 1.3rem/1.2 -apple-system,sans-serif; margin:0 0 8px; }
nav { display:flex; gap:8px; overflow:auto; }
nav button { border:1px solid var(--line); background:#f6f0e6; border-radius:999px; padding:8px 12px; font:14px/1.2 -apple-system,sans-serif; white-space:nowrap; }
nav button.on { background:var(--ink); color:#fff; }
main { max-width:720px; margin:0 auto; padding:16px 14px 72px; }
article { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
h2 { font:600 1.25rem/1.3 -apple-system,sans-serif; margin:0 0 8px; }
h3 { font:600 1rem/1.3 -apple-system,sans-serif; margin:16px 0 6px; }
p, li { margin:0 0 10px; }
a { color:var(--accent); }
.meta { color:var(--muted); font:14px/1.45 -apple-system,sans-serif; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<header>
<p class="mark">Dune Learning</p>
<h1>Lessons, with the original link</h1>
<nav id="nav"></nav>
</header>
<main id="main"></main>
<script>
const lessons = [
["Terminal", `<h2>The terminal video</h2>
<p class="meta">NetworkChuck. 2.2 million views. 34 minutes.</p>
<p><a href="https://www.youtube.com/watch?v=MsQACpcuTkU">Open the video</a> · <a href="https://github.com/theNetworkChuck/ai-in-the-terminal">His written guide</a></p>
<h3>Why this one is first</h3>
<p>You have been pasting notes into a chat box. This video shows the other way. The program sits in a folder on the computer. It can read a file and write a file. The chat is no longer the product. The file is.</p>
<h3>What he does</h3>
<p>He installs Gemini first because it is free. He makes a folder. He asks a small question. Gemini writes a file in that folder. Then he has it write gemini.md, a note the next session reads so he does not paste the old chat. Later he installs Claude Code, which needs a paid login, about $20 a month in his telling. He shows a worker with its own window, a critic that scores the work, and OpenCode, which can point at a model running on your own machine.</p>
<h3>What you take</h3>
<p>One folder. One note that says the model may only use the officer's write-up, and must say missing if a fact is not there. You still sign the draft. Do not open four tools on the first day.</p>`],
["Local", `<h2>Put the model on your machine</h2>
<p class="meta">NetworkChuck. About 2.7 million views.</p>
<p><a href="https://www.youtube.com/watch?v=Wjrdr0NU4Sk">Open the video</a></p>
<h3>Why it exists</h3>
<p>The last video used a company login. This one keeps the model file on the computer. Ollama is the program that holds the file. A simple window talks to it. The chat looks normal. The note did not have to be sent out.</p>
<h3>What you take</h3>
<p>Install Ollama. Pull a small model. Ask one harmless question. Write down the name of the file that answered. He also shows how to put that window on a website. Skip that. A client note does not go on a public site. Your two cards are 8 GB each. They do not automatically add up to 16.</p>`],
["Private", `<h2>Private is not the same as true</h2>
<p class="meta">NetworkChuck. About 2.6 million views.</p>
<p><a href="https://www.youtube.com/watch?v=WxYC9-hBM_g">Open the video</a></p>
<p>Same idea, shorter. A model on your machine means the note stays home. It does not mean the sentence is right. A private guess is still a guess. For the firm, the draft may quote the note or say missing. It may not invent a badge number.</p>`],
["Phone", `<h2>Claude on the phone</h2>
<p class="meta">NetworkChuck. About 278,000 views. This was missing from the last page.</p>
<p><a href="https://www.youtube.com/watch?v=FEDiAHzS0zw">Open the video</a></p>
<p>A phone screen that talks to an agent already running at home. It is a remote, not a new brain. Useless until the folder and the note exist. Kevin's Jarvis reel is the same idea.</p>`],
["Claude Code", `<h2>The paid builder</h2>
<p class="meta">Tech With Tim. About 1.7 million views. 36 minutes.</p>
<p><a href="https://www.youtube.com/watch?v=ntDIxaeo3Wg">Open the video</a></p>
<p>Claude Code is the program that reads the folder you opened and writes files in it. A file named CLAUDE.md is the standing order. Every new session reads it. He shows extra workers. You do not make one yet. Open it on the incident folder only, never on the whole computer.</p>`],
["Ollama", `<h2>The model file</h2>
<p class="meta">Tech With Tim. About 1.2 million views.</p>
<p><a href="https://www.youtube.com/watch?v=UtSSMs6ObqY">Open the video</a></p>
<p>Ollama loads a model file onto the card. Pull a small one. Run one prompt. Write down the tag. Q4 is the smaller, fuzzier copy. Q6 is cleaner and heavier. A report wants the cleaner copy if it fits. Do not pull a 27B file until the small one has drafted a fake note.</p>`],
["Official", `<h2>The vendor's own rules</h2>
<p class="meta">Anthropic. About 576,000 views. 26 minutes.</p>
<p><a href="https://www.youtube.com/watch?v=gv0WHhKelSE">Open the video</a></p>
<p>Plan before it edits. Keep the standing order short. One folder. You read what changed. Do not let it approve its own work. They will not pick your local model. Use this for behavior, and the Ollama video for the file.</p>`],
["Agents", `<h2>An agent is four parts</h2>
<p class="meta">Cole Medin. 30,200 views. 29 minutes. The louder companion is below.</p>
<p><a href="https://www.youtube.com/watch?v=i5kwX7jeWL8">Open the 30-minute video</a></p>
<p>Model. Prompt. One tool. A record of what the run did. He builds a small agent on screen, then talks about swapping models, a safety check, memory, a trace, and Docker. People fail by adding those before the four parts work.</p>
<p>Your prompt is the incident rule. Your tool is read this file, write that file. Your record is the check that the draft has headings, is a second file, and still says pending.</p>`],
["Best way", `<h2>Do not overbuild</h2>
<p class="meta">Cole Medin. 173,000 views. Missing from the last page.</p>
<p><a href="https://www.youtube.com/watch?v=U6LbW2IFUQw">Open the video</a></p>
<p>The same warning, with more views. The agent that ships is the small one. Memory products and a container wait until a fake note has produced a clean draft twice.</p>`],
["One person", `<h2>Cheap model, then a careful one</h2>
<p class="meta">Flux. About 8,600 views. 19 minutes. Transcript read.</p>
<p><a href="https://www.youtube.com/watch?v=TSl0RZK5Slo">Open the video</a></p>
<p>He installs Claude Code inside VS Code. Qwen, on his own machine through Ollama, does the cheap sorting. DeepSeek does the middle pass. Opus makes the decision. A timer wakes the loop. The second half scrapes local businesses and emails them a mock page. The thousand-task line was said, not shown.</p>
<p>You copy the split only. The local model lists what is in the note and what is missing. You write the sentences. You do not copy the email blast.</p>`],
["Drop folder", `<h2>A file moves through four folders</h2>
<p class="meta">Flux. About 2,200 views. 14 minutes. Transcript read.</p>
<p><a href="https://www.youtube.com/watch?v=UQHjMIzM-00">Open the video</a></p>
<p>You drop a video in inbox. A watcher sees it. The tool writes a caption and a timer posts it. Success goes to published. Failure goes to failed. Instagram needs a Meta business token. YouTube needs a Google login token. TikTok and the others are in the title and not in the setup. 500 posts a day is the title, not a log.</p>
<p>Use the folders only after a report is approved, and only to make a clip from that draft. Watch the first file. No timer until you have read one run.</p>`],
["$50k site", `<h2>Spec before pages</h2>
<p class="meta">Flux. About 8,000 views. Missing from the last page.</p>
<p><a href="https://www.youtube.com/watch?v=FQ9ylO-G4p0">Open the video</a></p>
<p>He has Claude Code build a site from a written spec. The $50k figure is the title. No invoice is on the page. The takeaway is the spec. Write what the page must contain before any file is created.</p>`],
["Eight jobs", `<h2>Eight jobs, one file each</h2>
<p class="meta">Kevin Unk. 436 views. 46 minutes. Transcript read. Low views, kept because the handoff is named.</p>
<p><a href="https://www.youtube.com/watch?v=puPAEyNfdhs">Open the video</a></p>
<p>Hermes is the night program. He asks it for eight jobs: money, content, video, offer, where to post, follow-up, did it fail, and what to remember. Each job writes a file. The next job may only read that file. He says not to add a ninth.</p>
<p>Your eight is one. The officer's note goes in. The draft comes out. You sign it.</p>`],
["81 minutes", `<h2>The map of his stack</h2>
<p class="meta">Kevin Unk. 81 minutes. Transcript read. Missing from the last page.</p>
<p><a href="https://www.youtube.com/watch?v=xB4Vwwj0KQo">Open the video</a></p>
<p>He rents a graphics-card computer, logs in with a key, and uses Claude Code to set it up. Claude Code still needs its own paid login. Ollama holds the model. Hermes stays running. He says Q6 or cleaner when the model must use tools, Q4 only for chat. He scores the machine high and the thing he could sell lower. The hourly price on screen is his example, not your bill.</p>`],
["Your reels", `<h2>The reels you saved</h2>
<p class="meta">Caption and public page only. Empty ones are not here.</p>
<h3>Shannon</h3>
<p><a href="https://www.instagram.com/reel/DXW_055D7GF/">The reel</a>. The project that matches the name is a tester for a site you own. Each stage writes a file. Copy the stages. Do not copy an attack. <a href="https://github.com/KeygraphHQ/shannon">Keygraph Shannon</a>.</p>
<h3>Uncensored chat</h3>
<p><a href="https://www.instagram.com/reel/DcDMcj5uQiW/">The reel</a>. Comment TRUTH, he sends a link. No product name. Your version is two files on your machine. The normal one writes the client draft.</p>
<h3>Stadium page</h3>
<p><a href="https://www.instagram.com/reel/DcamdiWoqzB/">The reel</a>. One web page, 3D seats, fake prices. <a href="https://github.com/thebuggeddev/football-stadium">The repo</a>. Your overlay is flatter: name, score, note, you approve it before it goes on stream.</p>
<h3>Mods</h3>
<p><a href="https://www.instagram.com/reel/DeJ5MfTEjhe/">The reel</a>. Easy work goes to a cheaper model. That is the only part you need.</p>
<h3>Do not invent</h3>
<p><a href="https://www.instagram.com/reel/DeJ4lAhPETt/">The reel</a>. A model sees a title and fills the blank. Yours says missing.</p>
<h3>Ruflo</h3>
<p><a href="https://www.instagram.com/reel/DdJ8HSEqtwB/">The reel</a>. The 60-agent project is <a href="https://github.com/ruvnet/ruflo">Ruflo</a>. You still start with one job.</p>
<h3>Mimic</h3>
<p><a href="https://www.instagram.com/reel/Dd7nAyYItIp/">The reel</a>. <a href="https://github.com/littledivy/mimic">Mimic</a> watches calls from a session you already have and writes a Python client. Not for an app you do not own.</p>
<h3>Keys</h3>
<p><a href="https://www.instagram.com/reel/DYX_M8yx6r4/">The reel</a>. Keys leaked because they were in the code. Keep them in a private file git ignores.</p>
`]
];
const nav = document.getElementById("nav");
const main = document.getElementById("main");
lessons.forEach((item, i) => {
  const b = document.createElement("button");
  b.textContent = item[0];
  if (i===0) b.className = "on";
  b.onclick = () => {
    nav.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    main.querySelectorAll("article").forEach(a => a.hidden = a.dataset.i !== String(i));
    window.scrollTo(0,0);
  };
  nav.appendChild(b);
  const a = document.createElement("article");
  a.dataset.i = i;
  a.hidden = i!==0;
  a.innerHTML = item[1];
  main.appendChild(a);
});
</script>
</body>
</html>
