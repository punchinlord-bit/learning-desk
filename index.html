<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune Learning</title>
<style>
:root{--bg:#12100e;--panel:#1c1814;--ink:#f6f1e8;--muted:#cbbba8;--line:#3c342c;--accent:#e2a15c;--green:#8eae86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
.top{padding:14px 14px 8px;background:#16130f;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.mark{font:600 11px/1 -apple-system,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font:600 1.25rem/1.2 -apple-system,sans-serif;margin:0 0 8px}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
.tabs button{background:#241f1a;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font:13px/1 -apple-system,sans-serif;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#1a120c;border-color:var(--accent)}
main{max-width:880px;margin:0 auto;padding:12px}
article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.n{color:var(--green);font:12px/1 -apple-system,sans-serif}
h2{font:600 1.02rem/1.3 -apple-system,sans-serif;margin:4px 0 6px}
p{margin:0;color:var(--muted)}
</style></head><body>
<div class="top"><p class="mark">Dune Learning</p><h1>One lesson per video</h1><div class="tabs" id="tabs"></div></div>
<main id="main"></main>
<script>
const sources = {"NetworkChuck": [["You've been using AI the hard way", "2.2 million views, 34 minutes. The browser hides the context window. The terminal can see a folder. Start here. Make one folder, let Gemini write a file, then stop."], ["Host all your AI locally", "About 2.7 million views. Ollama holds the model. Open WebUI is the window. Stop before a public domain. Incident notes stay on the machine."], ["Run your own AI, private", "About 2.6 million views. Same lesson, shorter. A model is a file. Load it. Do not add the two 8 GB cards in your head."], ["Claude Code on your phone", "About 278,000 views. A remote for an agent already running. Useless until the folder and the skill exist."]], "Cole Medin": [["90 percent of agents in 30 minutes", "30,200 views. Four parts: model, prompt, one tool, a trace. Your tool is read this file, write that file."], ["Best way to build agents", "173,000 views. The warning cut. People fail by adding pieces. Keep the agent small."], ["Complete agent blueprint", "77,000 views. His map from empty folder to a working agent. Use it as a map, not a second product."], ["Pydantic plus DeepSeek", "80,000 views. A typed output. Useful later so the draft cannot skip a heading. Not the first run."], ["28 minutes that change the build", "54,000 views. Another pass on the same four parts. Watch after the 30-minute one if the first did not stick."], ["Three labs' agent guides in 18 minutes", "39,000 views. Official guides, compressed. Plan, tool permission, human check."], ["Top 20 lessons from hundreds of agents", "17,000 views. A list of scars. Take the ones that match the note-and-draft loop. Leave the rest."]], "Tech With Tim": [["Claude Code for beginners", "About 1.7 million views, 36 minutes. Install. Open one folder. Context file is the standing order."], ["Ollama in 15 minutes", "About 1.2 million views. Pull a small model. One prompt. Write down the tag. Then the fake note."]], "Anthropic": [["Claude Code best practices", "About 576,000 views, 26 minutes. Plan, short context file, one folder, you review the diff. They do not pick your local model."]], "Flux": [["500 posts a day", "About 2,200 views, 14 minutes. Transcript read. Inbox, posting, published, failed. 500 is a claim. Watch the first file."], ["One-person stack", "About 8,600 views, 19 minutes. Transcript read. Qwen sorts, DeepSeek middle, Opus decides. Token-cut number was not shown."], ["$50k website", "About 8,000 views, 21 minutes. Spec before pages. The price is the title. Assets sit on a Drive file."], ["Coca-Cola edit", "7 minutes, 77 views. A commercial made cheap. Editing craft. Not the report loop."], ["Liquid glass preset", "12 minutes, about 4,300 views. DaVinci look. Later, for a title card. Not a model."], ["3D client edit", "9 minutes. DaVinci. Listed only. Not an agent lesson."], ["Eye animation", "11 minutes. Retention edit in Resolve. Listed only."], ["Soft color grade", "7 minutes. Color. Listed only."], ["Split transition", "10 minutes. Fusion transition. Listed only."], ["Apple-style 3D", "18 minutes. Motion in Resolve. Listed only."], ["Left After Effects", "21 minutes. Resolve versus After Effects. Listed only."]], "Kevin Unk": [["Five projects, one system", "81 minutes. Transcript read. Rented card, SSH, Claude Code still paid, Ollama, Hermes, a dashboard that reads files."], ["Eight jobs", "46 minutes. Transcript read. Eight files. Do not add a ninth. Your eight is one draft."], ["Omarchy", "8 minutes, 715 views. A Linux desktop for agents. Skip until the note loop works."], ["Jarvis phone app", "11 minutes, 37 views. A remote for Hermes already running. Same rule as Chuck's phone video."], ["GoHighLevel sales cut", "7 minutes. Agents on 74 videos, in the title. Money claims are titles. The pipeline shape is the lesson."], ["Editing and posting engine", "23 minutes. Claude Code cuts and posts. Copy the folder. Do not copy a volume claim."], ["Business operating system", "12 minutes. Short map of the same stack as the 81-minute tour."], ["Mission control", "26 minutes. Dashboard over business data. Listing does not prove the data was live."], ["100 videos at once", "20 minutes. Remotion and Hyperframes. 100 is the title. A clip only after an approved draft."], ["Hermes for six hours", "31 minutes. Overnight run, in the title. No log on the page. A night agent still needs a job file."], ["One-prompt Jarvis short", "3 minutes. Comment bait. A spec file and a rented card. Not a build guide."], ["24-7 short", "75 seconds, about 1,100 views. Claude on a GPU pod, Hermes beside it. A trailer, not a lesson."]], "Mark Gadala": [["Uncensored agents on any computer", "Public description. Ollama, Hermes, a 27B for 24 GB, a 2B for 4 GB. Your card is 8 GB. Transcript was not fetched."]], "AICodeKing": [["SuperGemma with Hermes", "A 26B uncensored file paired with a harness. He says about 24 GB. Not your 2080. Read the card before a pull."]], "Saved reels": [["Shannon", "Developers as a Service. Caption says Claude Code for hackers. Public project is Keygraph's tester. Copy the stage files. No attack steps. Only an app you own."], ["Uncensored platform", "Elijah's alt. Comment TRUTH. No product name. 46,000 users is his claim. Two local files instead."], ["Six repos", "techskills carousel. Hyperframes is the only keep, and only for a later card. Camofox stays out. Trading repos stay out."], ["Stadium page", "rammcodes. Claude and Three.js built a seat map. Your overlay is flatter: name, score, note, you approve."], ["Browser games", "wassimyounes, the Flux account. Comment GAMES. Not this desk."], ["Claude mods", "nocode.joshua. Sessions message each other, a dashboard, cheap model for easy work. Copy the cheap split. Agents hand off a file."], ["Do not fill the blank", "Champ McCorkle. A model invents from a title. Yours says missing."], ["Color wheel", "theecommguy. Contrast for thumbnails. Later, if you cut a card."], ["Mimic", "alex.nex.tech. Watches an app and emits Python. Caption claim. Not a lesson to clone a private API."], ["Store scraper", "emma.scrapes. Claude plus a vendor scraper for prices. A funnel. Not the report."], ["Composio", "bri.buildss. Hashtags only. A plug layer. Not the first job."], ["Hugging bay", "wutronicai. Two words, no link. Unavailable beyond the caption."], ["Vibecoding hashtags", "Mark. Tags only. No steps."], ["ChatGPT party", "irungracepace. No prompt in the caption."], ["Secrets on GitHub", "deonnahodges. Keys leak. Env file, gitignored. Do not hunt other people's keys."], ["Comment Guide", "murphmaxxing. DM funnel for Claude prompts."], ["26-minute app", "futurewalt.ai. A Google engineer, Claude, no source link. Spec first is the only take."], ["60 agents", "Kayvon. Comment FLOW. Hashtag Ruflo. Repo not on the page. Start with one job."], ["Comment GitHub", "jamesmbuilds. No repo named."], ["Two reels with no caption", "DeIrl8UJZ0V and DeDW-x9MILy. Page did not return text. Not invented."]]};
const names = Object.keys(sources);
const tabs = document.getElementById("tabs");
const main = document.getElementById("main");
function show(name){
  tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.n===name));
  const items = sources[name];
  main.innerHTML = items.map((it,i)=>'<article><p class="n">'+name+' · lesson '+(i+1)+' of '+items.length+'</p><h2>'+it[0]+'</h2><p>'+it[1]+'</p></article>').join("");
}
names.forEach(n=>{const b=document.createElement("button"); b.textContent=n+" ("+sources[n].length+")"; b.dataset.n=n; b.onclick=()=>show(n); tabs.appendChild(b);});
show(names[0]);
</script></body></html>
